blueprint:
  name: "IKEA BILRESA - KAJPLATS Dimmer Steuerung (Event-Fix)"
  description: "Dimmer Steuerung für BILRESA mit event._taste_1 bis _taste_9 Entitäten."
  domain: automation
  source_url: https://github.com/FlorianDessloch/my-home-assistant-blueprints/blob/main/ikea_bilrea_dimmer.yaml
  input:
    bilresa_device:
      name: "BILRESA Remote (Quellgerät)"
      description: "Wähle hier deine IKEA BILRESA Fernbedienung aus."
      selector:
        device:
          multiple: false
    light_1:
      name: "Lampe Modus 1 (LED 1)"
      selector:
        entity:
          domain: light
    light_2:
      name: "Lampe Modus 2 (LED 2)"
      selector:
        entity:
          domain: light
    light_3:
      name: "Lampe Modus 3 (LED 3)"
      selector:
        entity:
          domain: light
    step_pct:
      name: "Dimm-Schrittweite (%)"
      description: "Helligkeitsänderung pro Scroll-Raste (Empfohlen: 5-10%)"
      default: 7
      selector:
        number:
          min: 1
          max: 20
          unit_of_measurement: "%"

mode: queued
max: 10

variables:
  target_device: !input bilresa_device
  l1: !input light_1
  l2: !input light_2
  l3: !input light_3
  step: !input step_pct

trigger:
  - platform: event
    event_type: state_changed

condition:
  - condition: template
    value_template: "{{ trigger.event.data.entity_id in device_entities(target_device) }}"
  - condition: template
    value_template: "{{ trigger.event.data.new_state is not none }}"

action:
  - variables:
      ent: "{{ trigger.event.data.entity_id }}"

  - choose:
      # === MODUS 1 (LED 1) ===
      # Taste 3: Toggle
      - conditions:
          - condition: template
            value_template: "{{ ent.endswith('_taste_3') or ent.endswith('_3') }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: !input light_1
          - delay:
              milliseconds: 200

      # Taste 1: Heller
      - conditions:
          - condition: template
            value_template: "{{ ent.endswith('_taste_1') or ent.endswith('_1') }}"
          - condition: template
            value_template: "{{ is_state(l1, 'on') }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_1
            data:
              brightness_step_pct: "{{ step }}"

      # Taste 2: Dunkler
      - conditions:
          - condition: template
            value_template: "{{ ent.endswith('_taste_2') or ent.endswith('_2') }}"
          - condition: template
            value_template: "{{ is_state(l1, 'on') }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_1
            data:
              brightness_step_pct: "{{ step * -1 }}"

      # === MODUS 2 (LED 2) ===
      # Taste 6: Toggle
      - conditions:
          - condition: template
            value_template: "{{ ent.endswith('_taste_6') or ent.endswith('_6') }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: !input light_2
          - delay:
              milliseconds: 200

      # Taste 4: Heller
      - conditions:
          - condition: template
            value_template: "{{ ent.endswith('_taste_4') or ent.endswith('_4') }}"
          - condition: template
            value_template: "{{ is_state(l2, 'on') }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_2
            data:
              brightness_step_pct: "{{ step }}"

      # Taste 5: Dunkler
      - conditions:
          - condition: template
            value_template: "{{ ent.endswith('_taste_5') or ent.endswith('_5') }}"
          - condition: template
            value_template: "{{ is_state(l2, 'on') }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_2
            data:
              brightness_step_pct: "{{ step * -1 }}"

      # === MODUS 3 (LED 3) ===
      # Taste 9: Toggle
      - conditions:
          - condition: template
            value_template: "{{ ent.endswith('_taste_9') or ent.endswith('_9') }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: !input light_3
          - delay:
              milliseconds: 200

      # Taste 7: Heller
      - conditions:
          - condition: template
            value_template: "{{ ent.endswith('_taste_7') or ent.endswith('_7') }}"
          - condition: template
            value_template: "{{ is_state(l3, 'on') }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_3
            data:
              brightness_step_pct: "{{ step }}"

      # Taste 8: Dunkler
      - conditions:
          - condition: template
            value_template: "{{ ent.endswith('_taste_8') or ent.endswith('_8') }}"
          - condition: template
            value_template: "{{ is_state(l3, 'on') }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_3
            data:
              brightness_step_pct: "{{ step * -1 }}"
